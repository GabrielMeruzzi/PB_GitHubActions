name: Java CI/CD

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: 21
          distribution: temurin

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build, Test, and Generate Reports
        run: mvn clean test -Dtest=!**/view/** site

      - name: Upload html report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-html-report
          path: target/site/

  deploy_stage:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment:
      name: stage
      url: https://meuapp-stage.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy to STAGE
        run: |
          echo "Deploy no ambiente STAGE executado."

  deploy_prod:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    environment:
      name: prod
      url: https://meuapp.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy to PROD
        run: |
          echo "Deploy no ambiente PROD executado."
