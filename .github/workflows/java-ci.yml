name: Java CI/CD

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: 21
          distribution: temurin

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build, Test (excluding Selenium) and Package
        run: |
          echo "Iniciando build e testes..."
          mvn clean package -Dtest=!**/view/** site
          echo "Build e testes finalizados com sucesso."

      - name: Upload html report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-html-report
          path: target/site/

  integration_test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: 21
          distribution: temurin

      - name: Run the app in background
        run: |
          echo "Starting Javalin app..."
          nohup java -jar target/*.jar &   # roda o Javalin em background
          APP_PID=$!
          echo $APP_PID > app.pid
          echo "Waiting for the app to start..."
          sleep 10  # espera alguns segundos para o app subir

      - name: Run smoke tests
        run: |
          echo "Testing if app is running..."
          curl -s -f http://localhost:7000/products || exit 1
          echo "App responded successfully."

      - name: Stop the app
        run: |
          echo "Stopping Javalin app..."
          kill $(cat app.pid)

  deploy_stage:
    needs: integration_test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment:
      name: stage
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy to STAGE
        run: |
          echo "Iniciando deploy em STAGE..."
          echo "Usando STAGE_API_KEY: $STAGE_API_KEY"
          echo "Deploy em STAGE concluído."
        env:
          STAGE_API_KEY: ${{ secrets.STAGE_API_KEY }}

  deploy_prod:
    needs: integration_test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    environment:
      name: prod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy to PROD
        run: |
          echo "Iniciando deploy em PROD..."
          echo "Usando PROD_API_KEY: $PROD_API_KEY"
          echo "Deploy em PROD concluído."
        env:
          PROD_API_KEY: ${{ secrets.PROD_API_KEY }}
