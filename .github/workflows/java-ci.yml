name: Java CI/CD

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: 21
          distribution: temurin

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build, Teste e Package
        run: |
          echo "Iniciando build e testes..."
          mvn clean package -Dtest=!**/view/** site
          echo "Build e testes finalizados com sucesso."
          echo "Arquivos gerados no target:"
          ls -l target/

      - name: Rodar Javalin em Background
        run: |
          echo "Iniciando Javalin..."
          nohup java -jar target/PB-ENG-DISC-SW-INFNET-1.0-SNAPSHOT.jar &
          sleep 10

      - name: Rodar Javalin Health Check
        run: |
          echo "Testando se Javalin iniciou..."
          curl -s -f http://localhost:7000/health || exit 1
          echo "Sucesso."

      - name: Upload html report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-html-report
          path: target/site/

  deploy_stage:
    needs: build_and_test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment:
      name: stage
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy to STAGE
        run: |
          echo "Iniciando deploy em STAGE..."
          echo "Usando STAGE_API_KEY: $STAGE_API_KEY"
          echo "Deploy em STAGE concluído."
        env:
          STAGE_API_KEY: ${{ secrets.STAGE_API_KEY }}

  deploy_prod:
    needs: build_and_test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    environment:
      name: prod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy to PROD
        run: |
          echo "Iniciando deploy em PROD..."
          echo "Usando PROD_API_KEY: $PROD_API_KEY"
          echo "Deploy em PROD concluído."
        env:
          PROD_API_KEY: ${{ secrets.PROD_API_KEY }}

  post_deploy_test:
    needs: [ deploy_stage, deploy_prod ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: 21
          distribution: temurin

      - name: Build do JAR
        run: |
          echo "Build do app para testes pós-deploy..."
          mvn clean package -Dtest=!**/view/** site
          ls -l target/

      - name: Determine environment
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/develop" ]]; then
            echo "ENVIRONMENT=stage" >> $GITHUB_ENV
          else
            echo "ENVIRONMENT=prod" >> $GITHUB_ENV
          fi

      - name: Start Javalin in background
        run: |
          echo "Iniciando Javalin para testes Selenium..."
          nohup java -jar target/PB-ENG-DISC-SW-INFNET-1.0-SNAPSHOT.jar &
          sleep 10

      - name: Run Selenium tests
        run: |
          echo "Rodando testes Selenium no $ENVIRONMENT..."
          mvn test -Dtest=org.pb_tp1.view.**/*Test.java

