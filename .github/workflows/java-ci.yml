name: Java CI/CD

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: 21
          distribution: temurin

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build, Test (unit) and Package
        run: mvn clean package -Dtest=!**/view/** site

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/PB-ENG-DISC-SW-INFNET-1.0-SNAPSHOT.jar

      - name: Upload html report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-html-report
          path: target/site/

  deploy_and_test:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/master' && 'prod' || 'stage' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: 21
          distribution: temurin

      - name: Download built JAR
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      - name: Start Javalin Application
        run: java -cp target/PB-ENG-DISC-SW-INFNET-1.0-SNAPSHOT.jar org.pb_tp1.App &

      - name: Wait for server to be ready
        run: |
          echo "Waiting for Javalin to start..."
          for i in {1..15}; do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:7000/products | grep -q 200; then
              echo "Server is up!"
              break
            fi
            echo "Server not ready yet... retrying"
            sleep 2
          done

      - name: Run Selenium Tests
        run: mvn verify -Dtest=org.pb_tp1.view.*Test
