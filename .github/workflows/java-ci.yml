name: Java CI/CD

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: 21
          distribution: temurin

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build, Test (excluding Selenium) and Package
        run: mvn clean package -Dtest=!**/view/** site

      - name: Upload fat JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/PB-ENG-DISC-SW-INFNET-1.0-SNAPSHOT-shaded.jar

      - name: Upload html report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-html-report
          path: target/site/

  deploy_stage:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment:
      name: stage
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy to STAGE
        env:
          STAGE_API_KEY: ${{ secrets.STAGE_API_KEY }}
        run: |
          echo "Usando STAGE_API_KEY: $STAGE_API_KEY"

  post_deploy_tests_stage:
    needs: deploy_stage
    runs-on: ubuntu-latest
    environment:
      name: stage
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: 21
          distribution: temurin

      - name: Download built fat JAR
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      - name: Start Javalin Application
        run: java -jar target/PB-ENG-DISC-SW-INFNET-1.0-SNAPSHOT-shaded.jar &

      - name: Wait for server
        run: |
          for i in {1..60}; do
            curl -s http://localhost:7000/products && break
            echo "Waiting for server..."
            sleep 2
          done

      - name: Run Selenium Tests in Stage
        run: mvn verify -Dtest=org.pb_tp1.view.*Test

  deploy_prod:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    environment:
      name: prod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy to PROD
        env:
          PROD_API_KEY: ${{ secrets.PROD_API_KEY }}
        run: |
          echo "Usando PROD_API_KEY: $PROD_API_KEY"

  post_deploy_tests_prod:
    needs: deploy_prod
    runs-on: ubuntu-latest
    environment:
      name: prod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: 21
          distribution: temurin

      - name: Download built fat JAR
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      - name: Start Javalin Application
        run: java -jar target/PB-ENG-DISC-SW-INFNET-1.0-SNAPSHOT-shaded.jar &

      - name: Wait for server
        run: |
          for i in {1..60}; do
            curl -s http://localhost:7000/products && break
            echo "Waiting for server..."
            sleep 2
          done

      - name: Run Selenium Tests in Production
        run: mvn verify -Dtest=org.pb_tp1.view.*Test
